name: Verify Background Recents

on:
  workflow_dispatch:
  push:
    branches: ['codex/background-recents']

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android framework and paired-client components
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest --console=plain
            python3 .github/scripts/verify_recents.py
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recents-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
